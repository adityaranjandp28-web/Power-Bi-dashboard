 const t=[...p.f].sort((a,b)=>b.v-a.v).filter(x=>x.v>=2).slice(0,3);p.top=t.length?t:[{n:'No significant factors',a:'Routine monitoring',v:0}];p.main=p.top[0].n;p.act=p.risk<30?'Routine monitoring':p.top[0].a;p.pri=['Monitor','Monitor','This week','Immediate'][p.lv]}

 const p={id:'S-'+(1001+i),name:nm(i),grp:c,yr,sem:yr*2-(rnd()<.5?1:0),att:R(att),perf:R(perf),eng:R(eng),back,fail,gpa:+(perf/25).toFixed(2),trend:series(perf,(s-.3)*3,1,2).map(R),attT:series(att,s,1.5,1.5).map(R),
  late:R(s*9+rnd()*3),missed:R((100-att)/100*80),assign:R(cl(100-back*14+nz(4))),lms:R(cl(eng+nz(8))),study:+(1+(1-s)*3+nz(.5)).toFixed(1),lib:R((1-s)*6+rnd()*2),subs:['Mathematics','Core theory','Laboratory','Elective'].map(n=>[n,R(cl(perf+nz(10)))])};
 score(p,EW,1.25);return p})}

 const perf=cl(86-s*45+nz(5)),att=cl(97-s*22+nz(3)),eng=cl(82-s*50+nz(7)),hrs=+(40+s*14+nz(2)).toFixed(1);
 const p={id:'E-'+(2001+i),name:nm(i+31),grp:d,role:ROLES[ri],loc:pick(LOC),ten,band:ri+1,crit:ri>=3,since:+(rnd()*Math.min(ten,6)).toFixed(1),promos:Math.floor(ten/2.5),band_t:ten<1?'Under 1 yr':ten<3?'1–3 yrs':ten<5?'3–5 yrs':'5+ yrs',
